<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GamingX Overlay — Меню</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="brand">G<sup>X</sup> OVERLAY</div>
    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Оверлей запущен</span>
    </div>
    <div class="flex" style="text-align:right;">
      <div style="font-size:0.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px">v1.0.0</div>
    </div>
  </header>

  <!-- Горячая клавиша -->
  <section class="section">
    <h2>Горячая клавиша меню</h2>
    <div class="row">
      <label>Открыть / закрыть меню</label>
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="flex" id="hotkeyDisplay" style="background:#0e1118;border:1px solid var(--border);color:var(--neon-cyan);padding:8px 12px;border-radius:8px;font-variant-numeric:tabular-nums">Ctrl+Alt+X</div>
        <button class="btn small" id="btnRecordHotkey">Записать клавишу</button>
        <button class="btn small" id="btnApplyHotkey" style="margin-left:8px">Применить</button>
      </div>
    </div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn small" id="btnToggleMenu">Закрыть меню (скрыть)</button>
    </div>
  </section>

  <!-- Модули оверлея -->
  <section class="section">
    <h2>Модули оверлея</h2>
    <div class="row toggle">
      <input type="checkbox" id="modFps" checked>
      <label for="modFps">Счётчик FPS + график</label>
    </div>
    <div class="row toggle">
      <input type="checkbox" id="modCpu" checked>
      <label for="modCpu">Загрузка процессора</label>
    </div>
    <div class="row toggle">
      <input type="checkbox" id="modRam" checked>
      <label for="modRam">Оперативная память</label>
    </div>
    <div class="row toggle">
      <input type="checkbox" id="modGpu" checked>
      <label for="modGpu">Графический процессор</label>
    </div>
    <div class="row toggle">
      <input type="checkbox" id="modBattery" checked>
      <label for="modBattery">Батарея / питание</label>
    </div>
    <div class="row toggle">
      <input type="checkbox" id="modUptime" checked>
      <label for="modUptime">Время работы системы</label>
    </div>
    <div class="row toggle">
      <input type="checkbox" id="modPing">
      <label for="modPing">Пинг до сервера (TCP)</label>
    </div>
    <div class="row toggle">
      <input type="checkbox" id="modCrosshair">
      <label for="modCrosshair">Прицел в центре экрана</label>
    </div>
  </section>

  <!-- Положение и вид -->
  <section class="section">
    <h2>Положение и внешний вид</h2>
    <div class="row">
      <label>Позиция на экране</label>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px; width:260px;">
        <button class="btn small pos-btn" data-pos="top-left">Левый верх</button>
        <button class="btn small pos-btn active" data-pos="top-right">Правый верх</button>
        <button class="btn small pos-btn" data-pos="bottom-left">Левый низ</button>
        <button class="btn small pos-btn" data-pos="bottom-right">Правый низ</button>
      </div>
    </div>
    <div class="slider-row">
      <label>Прозрачность</label>
      <input type="range" id="opacity" min="30" max="100" value="100">
      <span id="opacityVal">100%</span>
    </div>
    <div class="slider-row">
      <label>Размер шрифта</label>
      <input type="range" id="fontSize" min="10" max="26" value="16">
      <span id="fontSizeVal">16 px</span>
    </div>
    <div class="row">
      <label>Режим клика сквозь оверлей</label>
      <div style="display:flex;align-items:center;gap:10px;">
        <input type="checkbox" id="clickThrough" checked>
        <label for="clickThrough" style="width:auto">Вкл (оверлей не перехватывает мышь)</label>
        <button class="btn small" id="btnUnlock" style="margin-left:10px">Разблокировать перемещение</button>
      </div>
    </div>
  </section>

  <!-- Пинг -->
  <section class="section">
    <h2>Пинг до сервера</h2>
    <div class="row">
      <label>Хост</label>
      <input type="text" id="pingHost" value="1.1.1.1" placeholder="1.1.1.1">
    </div>
    <div class="row">
      <label>Порт</label>
      <input type="text" id="pingPort" value="443" placeholder="443">
    </div>
    <div class="row">
      <label>Порог тревоги FPS</label>
      <input type="text" id="fpsThreshold" value="30" placeholder="30">
    </div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn small" id="btnCheckPing">Проверить пинг</button>
      <span id="pingResult" style="color:var(--neon-cyan);font-variant-numeric:tabular-nums; margin-left:10px">—</span>
    </div>
  </section>

  <!-- Оптимизация системы -->
  <section class="section">
    <h2>Оптимизация системы во время игры</h2>
    <div class="row" style="justify-content:flex-start">
      <button class="btn primary" id="btnGameBoost">🚀 Game Boost (всё сразу)</button>
      <button class="btn" id="btnHighPerf">Схема питания: максимум</button>
      <button class="btn" id="btnCleanTemp">Очистить временные файлы</button>
    </div>
    <div class="row">
      <label>Завершить процесс по PID</label>
      <div style="display:flex;align-items:center;gap:10px; width:260px;">
        <input type="text" id="killPid" placeholder="PID процесса">
        <button class="btn danger small" id="btnKillProc">Завершить</button>
      </div>
    </div>
  </section>

  <!-- Лог операций -->
  <section class="section">
    <h2>Лог</h2>
    <div class="log" id="log">Готов к работе.</div>
  </section>

  <div class="footer">GamingX Overlay · горячая клавиша меню: Ctrl+Alt+X · оверлей работает поверх всех приложений</div>
</div>
<script src="renderer.js"></script>
</body>
</html>
