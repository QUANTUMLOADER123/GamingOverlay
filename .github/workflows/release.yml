name: Build Windows Release (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install NSIS (for .exe installer)
        run: choco install nsis -y

      - name: Build Windows installer
        env:
          DEBUG: "electron-builder"
        run: npx electron-builder --win

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0 --yes 2>nul || true
          gh release create v1.0.0 "release/GamingX Setup x64.exe" --title "GamingX Overlay v1.0.0" --notes "GamingX Overlay v1.0.0 — готовый .exe установщик"
