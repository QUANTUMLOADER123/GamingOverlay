name: Build Windows Release (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install NSIS (for .exe installer)
        run: choco install nsis -y

      - name: Build Windows installer + portable
        env:
          DEBUG: "electron-builder"
          ELECTRON_GET_USE_GLOBAL_CACHE: "true"
          ELECTRON_GET_MIRROR: "https://github.com/electron/electron/releases/download/"
        run: node_modules/.bin/electron-builder --win --verbose

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
