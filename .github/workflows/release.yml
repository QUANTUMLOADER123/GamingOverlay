name: Build Windows Release (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install NSIS (for .exe installer)
        run: choco install nsis -y

      - name: Build Windows installer (capture output)
        run: |
          npx electron-builder --win 2>&1 | tee build-output.log
          echo "=== EXIT CODE: ${PIPESTATUS[0]} ==="

      - name: Show build output on failure
        if: failure()
        run: |
          echo "=== BUILD OUTPUT LOG ==="
          cat build-output.log
          echo "=== END LOG ==="

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
