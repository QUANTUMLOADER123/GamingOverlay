name: Build Windows Release (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Windows .exe
        run: pyinstaller --onefile --windowed --name GamingX gamingx_overlay.py

      - name: Rename artifact
        run: ren dist\GamingX.exe GamingX_Overlay.exe

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: GamingX_Overlay
          path: dist/GamingX_Overlay.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/GamingX_Overlay.exe
          generate_release_notes: true
