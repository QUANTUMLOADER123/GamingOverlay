name: Build Windows Release (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify Electron binary
        run: node -e "const p = require('electron/path'); console.log('Electron path:', p); require('fs').access(p, (e) => console.log(e ? 'MISSING' : 'OK'))"

      - name: Install NSIS (for .exe installer)
        run: choco install nsis -y

      - name: Build Windows installer + portable
        env:
          DEBUG: "electron-builder"
        run: yarn dist --verbose

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
