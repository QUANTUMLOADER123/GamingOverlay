name: Build Windows Release (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW (g++ for Windows)
        run: choco install mingw -y

      - name: Build GamingX.exe with MinGW
        shell: cmd
        run: |
          refreshenv
          g++ gamingx_overlay.cpp -o GamingX.exe -luser32 -lgdi32 -lkernel32 -lshell32 -ladvapi32 -lws2_32 -mwindows -O2

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0 --yes 2>nul || true
          gh release create v1.0.0 "GamingX.exe" --title "GamingX Overlay v1.0.0" --notes "GamingX Overlay v1.0.0 — готовый .exe (собрано через MinGW на GitHub Actions)"
