name: Build Windows Release (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build GamingX.exe with MSVC (cl.exe)
        shell: cmd
        run: |
          cl /nologo /O2 /W3 gamingx_overlay.cpp /link user32.lib gdi32.lib kernel32.lib shell32.lib advapi32.lib iphlpapi.lib ws2_32.lib /OUT:GamingX.exe

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: GamingX_Overlay
          path: GamingX.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: GamingX.exe
          generate_release_notes: true
