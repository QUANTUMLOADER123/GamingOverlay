<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GamingX Overlay</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="scanlines"></div>
<div class="hud" id="hud">
  <header class="hud-header">
    <div class="brand">G<sup>X</sup> OVERLAY</div>
    <div class="fps-box" id="fps-box" style="display:none">
      <div class="label">FPS</div>
      <div class="value" id="fps-value">--</div>
    </div>
    <canvas id="fps-graph" width="200" height="24" style="display:none"></canvas>
  </header>
  <div class="metrics" id="metrics"></div>
  <div class="hint" id="hint">GAMINGX OVERLAY &nbsp;·&nbsp; CTRL+ALT+X — МЕНЮ</div>
  <div class="crosshair" id="crosshair" aria-hidden="true"></div>
</div>
<script src="overlay.js"></script>
</body>
</html>
